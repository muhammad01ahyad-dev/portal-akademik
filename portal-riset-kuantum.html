<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Riset — Fisika Kuantum Teori & Komputasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0A0E17;
    --bg-panel:#111726;
    --bg-panel-2:#182036;
    --bg-panel-3:#1E2740;
    --ink:#EDEFF5;
    --ink-dim:#93A0BC;
    --ink-faint:#5B6683;
    --line:#242F49;
    --line-soft:#1B2338;
    --teal:#5EEAD4;
    --teal-dim:#2A6F63;
    --amber:#F2B84B;
    --amber-dim:#7A5A20;
    --violet:#9C8CFB;
    --danger:#F1707A;
    --radius:10px;
    --serif:'Fraunces', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-void);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:var(--sans);cursor:pointer;}
  ::selection{background:var(--teal-dim);color:var(--ink);}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
  @media(max-width:640px){.wrap{padding:0 18px;}}

  /* ---------- Top nav (public) ---------- */
  .topnav{
    position:sticky;top:0;z-index:40;
    background:rgba(10,14,23,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .topnav-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.2px;}
  .brand-mark{width:22px;height:22px;flex:none;}
  .navlinks{display:flex;gap:26px;align-items:center;font-size:14px;color:var(--ink-dim);}
  .navlinks a{text-decoration:none;transition:color .15s;}
  .navlinks a:hover{color:var(--teal);}
  .btn-ghost{
    border:1px solid var(--line);background:transparent;color:var(--ink-dim);
    padding:8px 16px;border-radius:999px;font-size:13px;transition:.15s;
  }
  .btn-ghost:hover{border-color:var(--teal);color:var(--teal);}
  .navtoggle{display:none;}
  @media(max-width:760px){
    .navlinks{display:none;}
  }

  /* ---------- Hero ---------- */
  .hero{position:relative;padding:88px 0 64px;overflow:hidden;}
  .hero-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;}
  @media(max-width:840px){.hero-grid{grid-template-columns:1fr;}}
  .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--teal);margin-bottom:18px;display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--teal);display:inline-block;}
  h1.hero-title{
    font-family:var(--serif);font-weight:600;font-size:clamp(34px,5vw,54px);
    line-height:1.06;margin:0 0 18px;letter-spacing:-.01em;
  }
  h1.hero-title em{font-style:italic;color:var(--teal);font-weight:500;}
  .hero-sub{color:var(--ink-dim);font-size:16.5px;max-width:52ch;margin:0 0 26px;}
  .badges{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;}
  .badge{
    display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;
    padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim);
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap;}
  .btn-primary{
    background:var(--teal);color:#08201C;border:none;padding:12px 22px;border-radius:999px;
    font-weight:600;font-size:14px;transition:.15s;
  }
  .btn-primary:hover{background:#82f2e0;}
  .btn-secondary{
    background:transparent;border:1px solid var(--line);color:var(--ink);padding:12px 22px;
    border-radius:999px;font-size:14px;transition:.15s;
  }
  .btn-secondary:hover{border-color:var(--ink-dim);}

  /* wavefunction signature visual */
  .wavebox{position:relative;height:340px;}
  .wavebox svg{width:100%;height:100%;}
  .wpath{fill:none;stroke-width:1.4;opacity:.55;}
  .wpath.p1{stroke:var(--teal);}
  .wpath.p2{stroke:var(--violet);}
  .wpath.p3{stroke:var(--amber);}
  .wpath{animation:drift 9s ease-in-out infinite;}
  .wpath.p2{animation-duration:11s;animation-delay:-2s;}
  .wpath.p3{animation-duration:13s;animation-delay:-5s;}
  @keyframes drift{
    0%,100%{transform:translateY(0px) scaleY(1);}
    50%{transform:translateY(-6px) scaleY(1.08);}
  }
  .collapse-dot{fill:var(--teal);animation:pulse 2.6s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{opacity:.4;r:3.5;}
    50%{opacity:1;r:5.5;}
  }
  @media (prefers-reduced-motion: reduce){
    .wpath,.collapse-dot{animation:none;}
  }

  /* ---------- Sections ---------- */
  section.pubsec{padding:56px 0;border-top:1px solid var(--line-soft);}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap;}
  .sec-title{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;}
  .sec-note{font-family:var(--mono);font-size:12px;color:var(--ink-faint);}

  .about-text{color:var(--ink-dim);font-size:15.5px;max-width:70ch;}
  .about-text strong{color:var(--ink);font-weight:600;}

  /* orbit icon */
  .orbit{width:30px;height:30px;flex:none;position:relative;}
  .orbit svg{width:100%;height:100%;}

  /* timeline (progress penelitian / harian) */
  .timeline{position:relative;padding-left:26px;}
  .timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line);}
  .tl-item{position:relative;padding-bottom:26px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:'';position:absolute;left:-25px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--bg-void);border:1.5px solid var(--teal);
  }
  .tl-date{font-family:var(--mono);font-size:11.5px;color:var(--teal);margin-bottom:5px;letter-spacing:.03em;}
  .tl-title{font-weight:600;font-size:15px;margin-bottom:4px;}
  .tl-desc{color:var(--ink-dim);font-size:13.5px;}
  .tl-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);border:1px solid var(--line);padding:2px 8px;border-radius:999px;}

  /* card grid */
  .card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media(max-width:700px){.card-grid{grid-template-columns:1fr;}}
  .card{
    background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:20px;transition:.15s;
  }
  .card:hover{border-color:var(--line);background:var(--bg-panel-2);}
  .card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .card-title{font-weight:600;font-size:15px;line-height:1.35;}
  .card-date{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .card-desc{color:var(--ink-dim);font-size:13.5px;margin-bottom:14px;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;}
  .dl-btn{
    display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;
    color:var(--teal);background:transparent;border:1px solid var(--teal-dim);padding:7px 12px;border-radius:7px;
  }
  .dl-btn:hover{background:rgba(94,234,212,.08);}
  .dl-btn:disabled{color:var(--ink-faint);border-color:var(--line);cursor:not-allowed;}

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);padding:30px;text-align:center;
    color:var(--ink-faint);font-size:13.5px;font-family:var(--mono);
  }

  footer.site-foot{border-top:1px solid var(--line-soft);padding:34px 0 44px;color:var(--ink-faint);font-size:13px;}
  .foot-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  /* ---------- Login ---------- */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{
    width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--line-soft);
    border-radius:14px;padding:34px 30px;
  }
  .login-card h2{font-family:var(--serif);font-size:22px;margin:0 0 6px;}
  .login-card p.hint{color:var(--ink-faint);font-size:12.5px;margin:0 0 22px;font-family:var(--mono);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:7px;font-family:var(--mono);}
  .field input,.field textarea,.field select{
    width:100%;background:var(--bg-panel-3);border:1px solid var(--line);color:var(--ink);
    padding:10px 12px;border-radius:7px;font-size:14px;font-family:var(--sans);
  }
  .field textarea{resize:vertical;min-height:80px;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal);}
  .form-err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px;}
  .back-link{display:inline-block;margin-top:16px;font-size:13px;color:var(--ink-faint);text-decoration:none;}
  .back-link:hover{color:var(--teal);}

  /* ---------- Admin shell ---------- */
  .admin-shell{display:flex;min-height:100vh;}
  .admin-side{
    width:250px;flex:none;background:var(--bg-panel);border-right:1px solid var(--line-soft);
    padding:22px 16px;display:flex;flex-direction:column;
  }
  .admin-brand{font-family:var(--serif);font-size:16px;font-weight:600;padding:6px 10px 20px;}
  .admin-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .admin-nav button{
    display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:none;
    color:var(--ink-dim);padding:10px 10px;border-radius:8px;font-size:13.5px;
  }
  .admin-nav button:hover{background:var(--bg-panel-2);color:var(--ink);}
  .admin-nav button.active{background:var(--bg-panel-3);color:var(--teal);}
  .admin-nav .grp-label{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;padding:14px 10px 6px;}
  .admin-foot{border-top:1px solid var(--line-soft);padding-top:14px;display:flex;flex-direction:column;gap:6px;}
  .admin-foot button{background:none;border:none;color:var(--ink-faint);font-size:12.5px;text-align:left;padding:6px 10px;}
  .admin-foot button:hover{color:var(--danger);}

  .admin-main{flex:1;padding:34px 40px;max-width:920px;}
  @media(max-width:900px){
    .admin-shell{flex-direction:column;}
    .admin-side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;}
    .admin-nav{flex-direction:row;flex-wrap:wrap;}
    .admin-main{padding:24px;}
  }
  .admin-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
  .admin-head h2{font-family:var(--serif);font-size:24px;margin:0 0 4px;}
  .admin-head p{color:var(--ink-faint);font-size:13px;margin:0;}

  .entry-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px;margin-bottom:10px;
  }
  .entry-main{flex:1;min-width:0;}
  .entry-title{font-weight:600;font-size:14.5px;margin-bottom:4px;}
  .entry-meta{font-family:var(--mono);font-size:11px;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .entry-desc{color:var(--ink-dim);font-size:13px;}
  .entry-actions{display:flex;gap:6px;flex:none;}
  .icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--ink-dim);width:32px;height:32px;
    border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  .icon-btn:hover{border-color:var(--ink-dim);color:var(--ink);}
  .pub-toggle{
    font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
    color:var(--ink-faint);
  }
  .pub-toggle.on{color:var(--teal);border-color:var(--teal-dim);background:rgba(94,234,212,.06);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,8,13,.7);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal{
    width:100%;max-width:540px;max-height:88vh;overflow-y:auto;background:var(--bg-panel);
    border:1px solid var(--line);border-radius:14px;padding:28px;
  }
  .modal h3{font-family:var(--serif);font-size:19px;margin:0 0 18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .file-current{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-top:6px;display:flex;align-items:center;gap:8px;}
  .file-current button{background:none;border:none;color:var(--danger);font-size:11px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;}
  .warn-box{
    font-family:var(--mono);font-size:11.5px;color:var(--amber);background:rgba(242,184,75,.08);
    border:1px solid var(--amber-dim);padding:8px 12px;border-radius:7px;margin-top:8px;
  }

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-panel-3);
    border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:999px;font-size:13px;
    z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }

  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-family:var(--mono);font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var TYPES = [
    {key:'penelitian', label:'Progress Penelitian', short:'Penelitian', mode:'timeline', publicDefault:false, desc:'Perkembangan riset & temuan utama.'},
    {key:'harian',      label:'Progress Harian',      short:'Harian',     mode:'timeline', publicDefault:false, desc:'Catatan kerja harian di laboratorium/komputasi.'},
    {key:'paper',       label:'Paper',                short:'Paper',      mode:'card', publicDefault:true,  desc:'Manuskrip, preprint, dan publikasi.'},
    {key:'komputasi',   label:'Komputasi',             short:'Komputasi',  mode:'card', publicDefault:true,  desc:'Kode simulasi, notebook, hasil komputasi.'},
    {key:'kuliah',      label:'Catatan Kuliah',        short:'Kuliah',     mode:'card', publicDefault:false, desc:'Ringkasan materi kuliah yang diikuti.'},
    {key:'mengajar',    label:'Catatan Mengajar',      short:'Mengajar',   mode:'card', publicDefault:false, desc:'Modul & bahan ajar yang disusun.'},
    {key:'buku',        label:'Buku',                  short:'Buku',       mode:'card', publicDefault:true,  desc:'Naskah buku yang siap dipublikasikan.'}
  ];
  function typeInfo(k){ for(var i=0;i<TYPES.length;i++){ if(TYPES[i].key===k) return TYPES[i]; } return TYPES[0]; }

  var state = {
    view: 'loading', // loading | public | login | admin
    profile: null,
    content: [],
    activeTab: 'penelitian',
    authed: false,
    loginError: '',
    modal: null, // {type:'edit', entryType, id} or {type:'settings'} etc
    toast: null
  };

  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function defaultProfile(){
    return {
      name: 'Nama Anda',
      role: 'Kandidat Doktor · Fisika Kuantum Teori & Komputasi',
      institution: 'Institut Pertanian Bogor (IPB)',
      partner: 'Badan Riset dan Inovasi Nasional (BRIN)',
      bio: 'Peneliti dan mahasiswa PhD yang berfokus pada fisika kuantum teoretis dan komputasional — dari struktur elektronik hingga algoritma kuantum. Halaman ini adalah portal riset pribadi yang memuat perkembangan penelitian, publikasi, dan bahan ajar.',
      email: 'nama@apps.ipb.ac.id',
      focus: ['Mekanika Kuantum', 'Fisika Komputasi', 'Struktur Elektronik', 'Informasi Kuantum']
    };
  }

  function seedContent(){
    var now = Date.now();
    function day(offset){ var d=new Date(now-offset*86400000); return d.toISOString().slice(0,10); }
    return [
      {id:uid(), type:'penelitian', title:'(Contoh) Formulasi ulang Hamiltonian sistem dua-level terkopel', description:'Menurunkan bentuk tertutup untuk dinamika populasi pada sistem dua-level dengan kopling waktu-bergantung; hasil awal cocok dengan simulasi numerik.', date:day(3), tags:['hamiltonian','analitik'], published:false, fileName:null, createdAt:now},
      {id:uid(), type:'harian', title:'(Contoh) Debug solver Lindblad — divergensi pada langkah waktu besar', description:'Ditemukan sumber ketidakstabilan numerik pada integrator RK4 untuk master equation; beralih ke skema adaptif.', date:day(1), tags:['numerik','lindblad'], published:false, fileName:null, createdAt:now},
      {id:uid(), type:'paper', title:'(Contoh) Simulasi Variational Quantum Eigensolver untuk Molekul Sederhana', description:'Draf manuskrip tentang penerapan VQE pada H2 dan LiH dengan noise model realistis.', date:day(20), tags:['VQE','preprint'], published:true, fileName:null, createdAt:now},
      {id:uid(), type:'komputasi', title:'(Contoh) Notebook simulasi osilator harmonik terkuantisasi', description:'Implementasi Python untuk visualisasi fungsi gelombang dan evolusi paket gelombang Gaussian.', date:day(10), tags:['python','simulasi'], published:true, fileName:null, createdAt:now},
      {id:uid(), type:'buku', title:'(Contoh) Pengantar Komputasi Kuantum untuk Fisikawan', description:'Naskah buku ajar yang membahas dasar aljabar linear, gerbang kuantum, dan algoritma dasar.', date:day(40), tags:['buku ajar'], published:true, fileName:null, createdAt:now}
    ];
  }

  // ---------- storage helpers ----------
  async function loadAll(){
    try{
      var p = await window.storage.get('site-profile', true);
      state.profile = p ? JSON.parse(p.value) : defaultProfile();
      if(!p){ await window.storage.set('site-profile', JSON.stringify(state.profile), true); }
    }catch(e){ state.profile = defaultProfile(); try{ await window.storage.set('site-profile', JSON.stringify(state.profile), true);}catch(e2){} }

    try{
      var c = await window.storage.get('site-content', true);
      state.content = c ? JSON.parse(c.value) : seedContent();
      if(!c){ await window.storage.set('site-content', JSON.stringify(state.content), true); }
    }catch(e){ state.content = seedContent(); try{ await window.storage.set('site-content', JSON.stringify(state.content), true);}catch(e2){} }

    try{
      var a = await window.storage.get('site-auth', true);
      if(!a){ await window.storage.set('site-auth', JSON.stringify({password:'fisika2026'}), true); }
    }catch(e){ try{ await window.storage.set('site-auth', JSON.stringify({password:'fisika2026'}), true);}catch(e2){} }
  }

  async function saveContent(){
    try{ await window.storage.set('site-content', JSON.stringify(state.content), true); }
    catch(e){ showToast('Gagal menyimpan. Coba lagi.'); }
  }
  async function saveProfile(){
    try{ await window.storage.set('site-profile', JSON.stringify(state.profile), true); }
    catch(e){ showToast('Gagal menyimpan profil.'); }
  }
  async function getAuth(){
    try{ var a = await window.storage.get('site-auth', true); return a? JSON.parse(a.value): {password:'fisika2026'}; }
    catch(e){ return {password:'fisika2026'}; }
  }
  async function setAuth(pw){
    try{ await window.storage.set('site-auth', JSON.stringify({password:pw}), true); return true; }
    catch(e){ return false; }
  }

  function showToast(msg){
    state.toast = msg;
    render();
    setTimeout(function(){ state.toast=null; render(); }, 2400);
  }

  // ---------- icons ----------
  function orbitIcon(seed){
    var angle = (seed*47) % 180;
    return '<span class="orbit"><svg viewBox="0 0 30 30"><ellipse cx="15" cy="15" rx="12" ry="5" fill="none" stroke="var(--line)" stroke-width="1.2" transform="rotate('+angle+' 15 15)"/><ellipse cx="15" cy="15" rx="12" ry="5" fill="none" stroke="var(--teal)" stroke-width="1.2" opacity="0.55" transform="rotate('+(angle+60)+' 15 15)"/><circle cx="15" cy="15" r="2.1" fill="var(--amber)"/></svg></span>';
  }
  var ICON_DOWNLOAD = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>';
  var ICON_LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';
  var ICON_EDIT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
  var ICON_TRASH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13"/></svg>';
  var ICON_PLUS = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';

  // ---------- wavefunction hero svg ----------
  function waveSvg(){
    return '<svg viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet">'+
      '<path class="wpath p1" d="M10,120 C 60,60 100,180 150,120 C 200,60 240,180 290,120 C 320,90 350,120 390,110"/>'+
      '<path class="wpath p2" d="M10,180 C 60,240 100,120 150,180 C 200,240 240,120 290,180 C 320,210 350,180 390,190"/>'+
      '<path class="wpath p3" d="M10,150 C 70,100 110,200 170,150 C 230,100 270,200 330,150 C 355,130 375,150 390,150"/>'+
      '<circle class="collapse-dot" cx="200" cy="150" r="4"/>'+
      '</svg>';
  }

  // ---------- render router ----------
  function render(){
    var app = document.getElementById('app');
    if(state.view==='loading'){ app.innerHTML = '<div class="loading-screen">memuat portal…</div>'; return; }
    if(state.view==='login'){ app.innerHTML = renderLogin(); bindLogin(); return; }
    if(state.view==='admin'){ app.innerHTML = renderAdmin(); bindAdmin(); return; }
    app.innerHTML = renderPublic();
    bindPublic();
  }

  // ================= PUBLIC VIEW =================
  function renderPublic(){
    var p = state.profile;
    var pubItems = state.content.filter(function(e){return e.published;});
    var nameParts = p.name.split(' ');
    var firstWord = nameParts[0];

    function section(type){
      var t = typeInfo(type);
      var items = pubItems.filter(function(e){return e.type===type;}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
      var body;
      if(items.length===0){
        body = '<div class="empty">Belum ada konten "'+t.label+'" yang dipublikasikan.</div>';
      } else if(t.mode==='timeline'){
        body = '<div class="timeline">' + items.map(function(e){
          return '<div class="tl-item"><div class="tl-date">'+fmtDate(e.date)+'</div><div class="tl-title">'+esc(e.title)+'</div><div class="tl-desc">'+esc(e.description)+'</div>'+
          (e.tags&&e.tags.length? '<div class="tl-tags">'+e.tags.map(function(tg){return '<span class="tag">'+esc(tg)+'</span>';}).join('')+'</div>':'')+
          (e.fileName? '<div style="margin-top:10px;"><button class="dl-btn" data-download="'+e.id+'">'+ICON_DOWNLOAD+' '+esc(e.fileName)+'</button></div>':'')+
          '</div>';
        }).join('') + '</div>';
      } else {
        body = '<div class="card-grid">' + items.map(function(e){
          return '<div class="card"><div class="card-top"><div class="card-title">'+esc(e.title)+'</div><div class="card-date">'+fmtDate(e.date)+'</div></div>'+
          '<div class="card-desc">'+esc(e.description)+'</div>'+
          (e.tags&&e.tags.length? '<div class="tl-tags" style="margin-bottom:12px;">'+e.tags.map(function(tg){return '<span class="tag">'+esc(tg)+'</span>';}).join('')+'</div>':'')+
          '<div class="card-foot">'+
            (e.fileName? '<button class="dl-btn" data-download="'+e.id+'">'+ICON_DOWNLOAD+' Unduh</button>' : '<span style="font-family:var(--mono);font-size:11px;color:var(--ink-faint);">tanpa berkas</span>')+
          '</div></div>';
        }).join('') + '</div>';
      }
      return '<section class="pubsec" id="sec-'+type+'"><div class="wrap"><div class="sec-head">'+orbitIcon(TYPES.findIndex(function(x){return x.key===type;}))+
        '<div style="flex:1"><h3 class="sec-title" style="margin-top:6px;">'+t.label+'</h3></div>'+
        '<span class="sec-note">'+items.length+' dipublikasikan</span></div>'+body+'</div></section>';
    }

    var visibleTypes = TYPES.filter(function(t){ return pubItems.some(function(e){return e.type===t.key;}) || true; });
    // show all sections but visually only ones with content matter; keep all for consistent nav

    return ''+
    '<div class="topnav"><div class="wrap topnav-inner">'+
      '<div class="brand"><span class="brand-mark">'+orbitSmall()+'</span>'+esc(firstWord)+' — Portal Riset</div>'+
      '<div class="navlinks">'+
        '<a href="#sec-penelitian">Penelitian</a>'+
        '<a href="#sec-paper">Paper</a>'+
        '<a href="#sec-komputasi">Komputasi</a>'+
        '<a href="#sec-buku">Buku</a>'+
        '<a href="#about">Tentang</a>'+
      '</div>'+
      '<button class="btn-ghost" id="btn-goto-login">'+ICON_LOCK+' Masuk</button>'+
    '</div></div>'+

    '<section class="hero"><div class="wrap hero-grid">'+
      '<div><div class="eyebrow">Fisika Kuantum Teori & Komputasi</div>'+
      '<h1 class="hero-title">'+esc(p.name)+'<br><em>'+esc(p.role)+'</em></h1>'+
      '<p class="hero-sub">'+esc(p.bio)+'</p>'+
      '<div class="badges">'+
        '<span class="badge"><span class="dot"></span>'+esc(p.institution)+'</span>'+
        '<span class="badge"><span class="dot" style="background:var(--teal)"></span>Kerja sama '+esc(p.partner)+'</span>'+
      '</div>'+
      '<div class="hero-cta"><a class="btn-primary" href="#sec-paper">Lihat Publikasi</a><a class="btn-secondary" href="#about">Tentang Saya</a></div>'+
      '</div>'+
      '<div class="wavebox">'+waveSvg()+'</div>'+
    '</div></section>'+

    '<section class="pubsec" id="about"><div class="wrap">'+
      '<div class="sec-head"><h3 class="sec-title">Tentang</h3></div>'+
      '<p class="about-text">'+esc(p.bio)+'</p>'+
      '<div class="tl-tags" style="margin-top:16px;">'+p.focus.map(function(f){return '<span class="tag">'+esc(f)+'</span>';}).join('')+'</div>'+
    '</div></section>'+

    section('penelitian') + section('paper') + section('komputasi') + section('buku') + section('kuliah') + section('mengajar') + section('harian') +

    '<footer class="site-foot"><div class="wrap foot-row">'+
      '<span>© '+new Date().getFullYear()+' '+esc(p.name)+' · '+esc(p.institution)+'</span>'+
      '<span><a href="mailto:'+esc(p.email)+'" style="text-decoration:none;">'+esc(p.email)+'</a></span>'+
    '</div></footer>'+
    (state.toast? '<div class="toast">'+esc(state.toast)+'</div>':'');
  }

  function orbitSmall(){
    return '<svg viewBox="0 0 30 30" width="22" height="22"><ellipse cx="15" cy="15" rx="12" ry="5" fill="none" stroke="#5EEAD4" stroke-width="1.3"/><ellipse cx="15" cy="15" rx="12" ry="5" fill="none" stroke="#9C8CFB" stroke-width="1.3" transform="rotate(60 15 15)"/><ellipse cx="15" cy="15" rx="12" ry="5" fill="none" stroke="#F2B84B" stroke-width="1.3" transform="rotate(120 15 15)"/><circle cx="15" cy="15" r="2.3" fill="#EDEFF5"/></svg>';
  }

  function bindPublic(){
    var b = document.getElementById('btn-goto-login');
    if(b) b.onclick = function(){ state.view='login'; state.loginError=''; render(); };
    document.querySelectorAll('[data-download]').forEach(function(btn){
      btn.onclick = function(){ downloadFile(btn.getAttribute('data-download')); };
    });
  }

  // ================= LOGIN VIEW =================
  function renderLogin(){
    return '<div class="login-screen"><div class="login-card">'+
      '<h2>Masuk sebagai Pengelola</h2>'+
      '<p class="hint">Kata sandi default: <strong style="color:var(--ink-dim)">fisika2026</strong> — ubah setelah masuk lewat Pengaturan.</p>'+
      '<div class="field"><label>Kata sandi</label><input type="password" id="login-pw" autofocus></div>'+
      '<button class="btn-primary" id="login-submit" style="width:100%;">Masuk</button>'+
      '<div class="form-err">'+esc(state.loginError)+'</div>'+
      '<a class="back-link" id="login-back" href="#">← Kembali ke situs publik</a>'+
    '</div></div>';
  }
  function bindLogin(){
    document.getElementById('login-back').onclick = function(e){ e.preventDefault(); state.view='public'; render(); };
    var submit = async function(){
      var pw = document.getElementById('login-pw').value;
      var auth = await getAuth();
      if(pw === auth.password){
        state.authed = true; state.view='admin'; state.activeTab='penelitian'; state.loginError='';
        render();
      } else {
        state.loginError = 'Kata sandi salah. Coba lagi.';
        render();
      }
    };
    document.getElementById('login-submit').onclick = submit;
    document.getElementById('login-pw').addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  }

  // ================= ADMIN VIEW =================
  function renderAdmin(){
    var isSettings = state.activeTab === '__settings';
    return '<div class="admin-shell">'+
      '<div class="admin-side">'+
        '<div class="admin-brand">'+orbitSmall()+' Panel Pengelola</div>'+
        '<div class="admin-nav">'+
          TYPES.map(function(t){
            var count = state.content.filter(function(e){return e.type===t.key;}).length;
            return '<button data-tab="'+t.key+'" class="'+(state.activeTab===t.key?'active':'')+'">'+esc(t.label)+' <span style="margin-left:auto;color:var(--ink-faint);font-family:var(--mono);font-size:11px;">'+count+'</span></button>';
          }).join('')+
          '<div class="grp-label">Lainnya</div>'+
          '<button data-tab="__settings" class="'+(isSettings?'active':'')+'">Pengaturan Profil</button>'+
        '</div>'+
        '<div class="admin-foot">'+
          '<button id="admin-view-public">↗ Lihat situs publik</button>'+
          '<button id="admin-logout">Keluar</button>'+
        '</div>'+
      '</div>'+
      '<div class="admin-main">'+ (isSettings ? renderSettingsPanel() : renderEntryPanel(state.activeTab)) +'</div>'+
    '</div>'+
    (state.modal ? renderModal() : '') +
    (state.toast? '<div class="toast">'+esc(state.toast)+'</div>':'');
  }

  function renderEntryPanel(typeKey){
    var t = typeInfo(typeKey);
    var items = state.content.filter(function(e){return e.type===typeKey;}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
    return '<div class="admin-head"><div><h2>'+esc(t.label)+'</h2><p>'+esc(t.desc)+'</p></div>'+
      '<button class="btn-primary" id="add-entry" data-type="'+typeKey+'">'+ICON_PLUS+' Tambah</button></div>'+
      (items.length===0 ? '<div class="empty">Belum ada entri. Klik "Tambah" untuk membuat yang pertama.</div>' :
       items.map(function(e){
        return '<div class="entry-row"><div class="entry-main">'+
          '<div class="entry-title">'+esc(e.title)+'</div>'+
          '<div class="entry-meta"><span>'+fmtDate(e.date)+'</span>'+(e.fileName? '<span>· '+esc(e.fileName)+'</span>':'<span>· tanpa berkas</span>')+'</div>'+
          '<div class="entry-desc">'+esc(e.description)+'</div>'+
        '</div><div class="entry-actions">'+
          '<button class="pub-toggle '+(e.published?'on':'')+'" data-toggle="'+e.id+'">'+(e.published?'Publik':'Draf')+'</button>'+
          '<button class="icon-btn" data-edit="'+e.id+'" title="Ubah">'+ICON_EDIT+'</button>'+
          '<button class="icon-btn" data-del="'+e.id+'" title="Hapus">'+ICON_TRASH+'</button>'+
        '</div></div>';
      }).join(''));
  }

  function renderSettingsPanel(){
    var p = state.profile;
    return '<div class="admin-head"><div><h2>Pengaturan Profil</h2><p>Informasi ini tampil di halaman publik.</p></div></div>'+
      '<div class="field"><label>Nama</label><input id="set-name" value="'+escAttr(p.name)+'"></div>'+
      '<div class="field"><label>Peran / Gelar</label><input id="set-role" value="'+escAttr(p.role)+'"></div>'+
      '<div class="field"><label>Institusi</label><input id="set-institution" value="'+escAttr(p.institution)+'"></div>'+
      '<div class="field"><label>Mitra Kerja Sama</label><input id="set-partner" value="'+escAttr(p.partner)+'"></div>'+
      '<div class="field"><label>Bio singkat</label><textarea id="set-bio">'+esc(p.bio)+'</textarea></div>'+
      '<div class="field"><label>Email kontak</label><input id="set-email" value="'+escAttr(p.email)+'"></div>'+
      '<div class="field"><label>Fokus riset (pisahkan dengan koma)</label><input id="set-focus" value="'+escAttr(p.focus.join(', '))+'"></div>'+
      '<button class="btn-primary" id="save-profile">Simpan Profil</button>'+
      '<div style="height:1px;background:var(--line-soft);margin:30px 0;"></div>'+
      '<h3 style="font-family:var(--serif);font-size:18px;margin-bottom:14px;">Ubah Kata Sandi</h3>'+
      '<div class="field"><label>Kata sandi baru</label><input type="password" id="set-newpw"></div>'+
      '<button class="btn-secondary" id="save-pw">Simpan Kata Sandi</button>'+
      '<div class="warn-box" style="margin-top:20px;">Catatan: gerbang kata sandi ini berjalan sepenuhnya di sisi klien (browser) dan cocok untuk mengatur tampilan konten, bukan untuk melindungi data rahasia. Untuk keamanan produksi sesungguhnya, gunakan backend/autentikasi server.</div>';
  }

  function renderModal(){
    var m = state.modal;
    if(m.kind==='entry'){
      var t = typeInfo(m.entryType);
      var e = m.id ? state.content.find(function(x){return x.id===m.id;}) : {title:'',description:'',date:new Date().toISOString().slice(0,10),tags:[],published:t.publicDefault,fileName:null};
      return '<div class="modal-backdrop" id="modal-backdrop"><div class="modal">'+
        '<h3>'+(m.id?'Ubah':'Tambah')+' — '+esc(t.label)+'</h3>'+
        '<div class="field"><label>Judul</label><input id="f-title" value="'+escAttr(e.title)+'"></div>'+
        '<div class="field"><label>Deskripsi</label><textarea id="f-desc">'+esc(e.description)+'</textarea></div>'+
        '<div class="field"><label>Tanggal</label><input type="date" id="f-date" value="'+esc(e.date)+'"></div>'+
        '<div class="field"><label>Tag (pisahkan dengan koma)</label><input id="f-tags" value="'+escAttr((e.tags||[]).join(', '))+'"></div>'+
        '<div class="field"><label>Berkas (PDF, gambar, dsb — maks ±3MB disarankan)</label>'+
          '<input type="file" id="f-file">'+
          (e.fileName? '<div class="file-current">Berkas saat ini: '+esc(e.fileName)+' <button type="button" id="f-remove-file" data-id="'+(e.id||'')+'">Hapus</button></div>':'')+
          '<div class="warn-box" id="f-file-warn" style="display:none;"></div>'+
        '</div>'+
        '<div class="field checkbox-row"><input type="checkbox" id="f-published" '+(e.published?'checked':'')+'><label for="f-published">Publikasikan ke halaman publik</label></div>'+
        '<div class="modal-actions"><button class="btn-secondary" id="modal-cancel">Batal</button><button class="btn-primary" id="modal-save" data-type="'+m.entryType+'" data-id="'+(m.id||'')+'">Simpan</button></div>'+
      '</div></div>';
    }
    return '';
  }

  function bindAdmin(){
    document.querySelectorAll('[data-tab]').forEach(function(btn){
      btn.onclick = function(){ state.activeTab = btn.getAttribute('data-tab'); render(); };
    });
    var vp = document.getElementById('admin-view-public');
    if(vp) vp.onclick = function(){ state.view='public'; render(); };
    var lo = document.getElementById('admin-logout');
    if(lo) lo.onclick = function(){ state.authed=false; state.view='public'; render(); };

    var addBtn = document.getElementById('add-entry');
    if(addBtn) addBtn.onclick = function(){ state.modal = {kind:'entry', entryType: addBtn.getAttribute('data-type'), id:null}; render(); };

    document.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute('data-edit');
        var entry = state.content.find(function(x){return x.id===id;});
        state.modal = {kind:'entry', entryType: entry.type, id: id};
        render();
      };
    });
    document.querySelectorAll('[data-del]').forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute('data-del');
        if(!confirm('Hapus entri ini? Tindakan tidak dapat dibatalkan.')) return;
        state.content = state.content.filter(function(x){return x.id!==id;});
        await saveContent();
        try{ await window.storage.delete('file:'+id, true); }catch(e){}
        showToast('Entri dihapus.');
      };
    });
    document.querySelectorAll('[data-toggle]').forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute('data-toggle');
        var entry = state.content.find(function(x){return x.id===id;});
        entry.published = !entry.published;
        await saveContent();
        render();
        showToast(entry.published? 'Dipublikasikan ke publik.' : 'Dijadikan draf.');
      };
    });

    // settings
    var saveProfileBtn = document.getElementById('save-profile');
    if(saveProfileBtn) saveProfileBtn.onclick = async function(){
      state.profile.name = document.getElementById('set-name').value.trim() || state.profile.name;
      state.profile.role = document.getElementById('set-role').value.trim();
      state.profile.institution = document.getElementById('set-institution').value.trim();
      state.profile.partner = document.getElementById('set-partner').value.trim();
      state.profile.bio = document.getElementById('set-bio').value.trim();
      state.profile.email = document.getElementById('set-email').value.trim();
      state.profile.focus = document.getElementById('set-focus').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
      await saveProfile();
      showToast('Profil disimpan.');
    };
    var savePwBtn = document.getElementById('save-pw');
    if(savePwBtn) savePwBtn.onclick = async function(){
      var pw = document.getElementById('set-newpw').value;
      if(!pw || pw.length<4){ showToast('Kata sandi minimal 4 karakter.'); return; }
      await setAuth(pw);
      document.getElementById('set-newpw').value='';
      showToast('Kata sandi diperbarui.');
    };

    bindModal();
  }

  function bindModal(){
    var backdrop = document.getElementById('modal-backdrop');
    if(!backdrop) return;
    var cancel = document.getElementById('modal-cancel');
    if(cancel) cancel.onclick = function(){ state.modal=null; render(); };

    var fileInput = document.getElementById('f-file');
    var pendingFile = null; // {name, mime, dataUrl}
    if(fileInput) fileInput.addEventListener('change', function(){
      var file = fileInput.files[0];
      var warn = document.getElementById('f-file-warn');
      if(!file){ pendingFile=null; return; }
      if(file.size > 3.5*1024*1024){
        warn.style.display='block';
        warn.textContent = 'Berkas ini '+(Math.round(file.size/1024/1024*10)/10)+'MB — melebihi batas aman (±3MB). Pilih berkas lain atau kompres dulu.';
        fileInput.value='';
        pendingFile=null;
        return;
      }
      warn.style.display='none';
      var reader = new FileReader();
      reader.onload = function(){ pendingFile = {name:file.name, mime:file.type, dataUrl:reader.result}; };
      reader.readAsDataURL(file);
    });

    var removeFileBtn = document.getElementById('f-remove-file');
    var removeFileFlag = false;
    if(removeFileBtn) removeFileBtn.onclick = function(){
      removeFileFlag = true;
      removeFileBtn.parentElement.style.display='none';
    };

    var saveBtn = document.getElementById('modal-save');
    if(saveBtn) saveBtn.onclick = async function(){
      var type = saveBtn.getAttribute('data-type');
      var id = saveBtn.getAttribute('data-id');
      var title = document.getElementById('f-title').value.trim();
      if(!title){ showToast('Judul wajib diisi.'); return; }
      var description = document.getElementById('f-desc').value.trim();
      var date = document.getElementById('f-date').value || new Date().toISOString().slice(0,10);
      var tags = document.getElementById('f-tags').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
      var published = document.getElementById('f-published').checked;

      if(id){
        var entry = state.content.find(function(x){return x.id===id;});
        entry.title=title; entry.description=description; entry.date=date; entry.tags=tags; entry.published=published;
        if(removeFileFlag){ entry.fileName=null; try{ await window.storage.delete('file:'+id, true);}catch(e){} }
        if(pendingFile){ entry.fileName=pendingFile.name; entry.fileMime=pendingFile.mime; try{ await window.storage.set('file:'+id, pendingFile.dataUrl, true);}catch(e){ showToast('Gagal menyimpan berkas (mungkin terlalu besar).'); } }
      } else {
        var newId = uid();
        var newEntry = {id:newId, type:type, title:title, description:description, date:date, tags:tags, published:published, fileName: pendingFile?pendingFile.name:null, fileMime: pendingFile?pendingFile.mime:null, createdAt:Date.now()};
        state.content.push(newEntry);
        if(pendingFile){ try{ await window.storage.set('file:'+newId, pendingFile.dataUrl, true);}catch(e){ showToast('Gagal menyimpan berkas (mungkin terlalu besar).'); } }
      }
      await saveContent();
      state.modal = null;
      render();
      showToast('Tersimpan.');
    };
  }

  async function downloadFile(id){
    try{
      var f = await window.storage.get('file:'+id, true);
      if(!f){ showToast('Berkas tidak ditemukan.'); return; }
      var entry = state.content.find(function(x){return x.id===id;});
      var a = document.createElement('a');
      a.href = f.value;
      a.download = entry && entry.fileName ? entry.fileName : 'berkas';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }catch(e){ showToast('Gagal mengunduh berkas.'); }
  }

  // ---------- utils ----------
  function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function escAttr(s){ return esc(s); }
  function fmtDate(d){
    if(!d) return '';
    var parts = d.split('-');
    if(parts.length!==3) return d;
    var months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return parts[2]+' '+months[parseInt(parts[1],10)-1]+' '+parts[0];
  }

  // ---------- init ----------
  (async function init(){
    await loadAll();
    state.view = 'public';
    render();
  })();

})();
</script>
</body>
</html>
